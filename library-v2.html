<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>剧库 · 创世录</title>
<meta name="theme-color" content="#0B0B0C">
<link rel="manifest" href="library-v2-manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="片库">
<link rel="apple-touch-icon" href="icons-lib/lib-180.png">
<style>
:root{
  --bg:#0B0B0C; --surface:#141416; --surface-2:#1B1B1E;
  --fg:#ECECEE; --fg-2:#A6A6AD; --fg-3:#74747C;
  --accent:#FF4D3D; --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --gutter:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
     -webkit-font-smoothing:antialiased;min-height:100vh}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:fixed;top:-56px;left:16px;z-index:60;background:var(--surface-2);color:var(--fg);
      padding:12px 16px;border-radius:10px;text-decoration:none;font-size:16px;border:1px solid var(--line-2)}
.skip:focus{top:12px}

/* 顶栏 */
header{position:sticky;top:0;z-index:30;background:rgba(11,11,12,.86);backdrop-filter:blur(12px);
       border-bottom:1px solid var(--line)}
.bar{height:64px;display:flex;align-items:center;gap:8px;padding:0 var(--gutter)}
.back{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--fg);text-decoration:none;
      transition:transform .16s ease,background .16s ease}
.back:hover{background:rgba(255,255,255,.06);transform:translateY(-1px)}
.back:active{transform:translateY(1px) scale(.985)}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{margin:0;font-size:20px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.tag{margin-left:8px;font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums}

.wrap{padding:16px var(--gutter) 48px;max-width:640px;margin:0 auto}

/* 搜索 */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
label{font-size:13px;color:var(--fg-2)}
.inrow{display:flex;gap:8px}
input[type=search]{flex:1;height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--fg);font:16px/1 inherit}
input[type=search]::placeholder{color:var(--fg-3)}
input[type=search]:focus{outline:none;border-color:var(--accent)}
input[type=search]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{height:44px;padding:0 24px;border-radius:10px;border:1px solid var(--line-2);background:transparent;color:var(--fg);
  font:16px/1 inherit;cursor:pointer;transition:transform .16s ease,border-color .16s ease}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0B0B0C;font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}

/* 源切换：手动点，不做定时轮播 */
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--fg-2);font:13px/1 inherit;cursor:pointer;
  transition:transform .16s ease,border-color .16s ease,color .16s ease}
.chip:hover{transform:translateY(-1px);border-color:var(--line-2)}
.chip:active{transform:translateY(1px) scale(.985)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:#fff}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--fg-3);flex:none}
.chip[aria-pressed="true"] i,.chip.eps i{background:var(--accent)}

/* 剧卡 */
.card{display:block;width:100%;text-align:left;border:0;background:transparent;padding:0;margin:0 0 24px;
  color:var(--fg);cursor:pointer;transition:transform .16s ease}
.card:hover{transform:translateY(-1px)}
.card:active{transform:translateY(1px) scale(.985)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:12px}
.hero{display:flex;gap:16px;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.poster{width:88px;aspect-ratio:9/16;flex:none;border-radius:10px;overflow:hidden;
  background:radial-gradient(120% 90% at 20% 10%, rgba(255,77,61,.22), transparent 60%),
  linear-gradient(160deg,#1F1F23,#131315);
  border:1px solid var(--line);position:relative}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster span{position:absolute;left:8px;bottom:8px;font-size:13px;color:#fff;font-variant-numeric:tabular-nums;
  background:rgba(0,0,0,.62);padding:2px 8px;border-radius:999px}
.meta{min-width:0;display:flex;flex-direction:column;gap:4px}
.meta h2{margin:0;font-size:20px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.meta p{margin:0;font-size:16px;color:var(--fg-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta .row{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--fg-2);margin-top:auto;font-variant-numeric:tabular-nums}
.dot{width:3px;height:3px;border-radius:50%;background:var(--fg-3)}

/* 站源网格 */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gcard{border:0;padding:0;background:transparent;text-align:left;color:var(--fg);cursor:pointer;transition:transform .16s ease}
.gcard:hover{transform:translateY(-1px)}
.gcard:active{transform:translateY(1px) scale(.985)}
.gcard:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
.gposter{position:relative;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
/* 无封面退化：中性底 + 剧名首字，色阶由标题哈希决定（只在中性区间选，不出彩） */
.mono{position:absolute;inset:0;display:grid;place-items:center;color:#585860;font-weight:600;font-size:30px;
  letter-spacing:.04em;user-select:none}
.mono.t0{background:linear-gradient(165deg,#17171A,#101012)}
.mono.t1{background:linear-gradient(165deg,#1B1B1F,#121214)}
.mono.t2{background:linear-gradient(165deg,#141417,#1C1C20)}
.mono.t3{background:linear-gradient(165deg,#1D1D21,#141416)}
.gposter img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.gposter .n{position:absolute;right:8px;bottom:8px;font-size:13px;padding:3px 8px;border-radius:999px;
  background:rgba(0,0,0,.7);color:#fff;font-variant-numeric:tabular-nums}
.gposter .cap{position:absolute;left:8px;top:8px;font-size:13px;padding:3px 8px;border-radius:999px;
  background:rgba(11,11,12,.82);color:var(--fg-2);border:1px solid var(--line-2)}
.gt{margin-top:8px;font-size:16px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 空状态：一个图标 + 一句实话 + 一个能点的下一步，不做"什么都没有"的白屏 */
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px 16px;text-align:center}
.empty svg{opacity:.5}
.empty .t{margin:0;font-size:16px;font-weight:600}
.empty .d{margin:0;font-size:13px;color:var(--fg-2);line-height:1.7;max-width:280px}
.empty .btn{margin-top:8px}

.hint{font-size:13px;color:var(--fg-2);line-height:1.7}
.err{border:1px solid rgba(255,77,61,.4);background:rgba(255,77,61,.08);border-radius:12px;padding:16px;font-size:16px;line-height:1.6}
.err .t{display:block;font-weight:600;margin-bottom:4px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--surface-2);
  padding:2px 6px;border-radius:6px;border:1px solid var(--line)}

/* 详情面板 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line-2);
  border-radius:16px 16px 0 0;padding:16px var(--gutter) calc(20px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;
  transform:translateY(102%);transition:transform .22s cubic-bezier(.22,.8,.28,1)}
.sheet.open{transform:none}
.sheet{overflow-x:hidden}
.sheet .hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.sheet .hd h3{margin:0;font-size:20px;line-height:1.3;font-weight:600;flex:1}
.sheet .x{width:44px;height:44px;border-radius:10px;border:1px solid var(--line-2);background:transparent;color:var(--fg);
  font-size:16px;cursor:pointer;transition:transform .16s ease,border-color .16s ease}
.sheet .x:hover{border-color:var(--accent);transform:translateY(-1px)}
.sheet .x:active{transform:translateY(1px) scale(.985)}
.sheet .x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eps{display:flex;flex-direction:column;gap:8px}
.ep{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--fg);font:16px/1.4 inherit;text-align:left;text-decoration:none;
  transition:transform .16s ease,border-color .16s ease}
.ep:hover{transform:translateY(-1px);border-color:var(--line-2)}
.ep:active{transform:translateY(1px) scale(.985)}
.ep:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ep .no{font-size:13px;color:var(--fg-2);min-width:44px;font-variant-numeric:tabular-nums}
.ep .thumb{width:36px;aspect-ratio:9/16;border-radius:6px;object-fit:cover;flex:none;border:1px solid var(--line);background:var(--surface)}
.ep .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:39;opacity:0;pointer-events:none;transition:opacity .22s ease}
.mask.on{opacity:1;pointer-events:auto}

/* 布局自检面板（?audit=1） */
.auditbox{display:none;margin:0 0 16px;border:1px solid var(--line-2);border-radius:12px;padding:12px;
  background:var(--surface);font-size:13px;line-height:1.7}
.auditbox.on{display:block}
.auditbox .r{display:flex;gap:8px}
.auditbox .ok{color:#8FD6A2}
.auditbox .no{color:var(--accent)}

@media (prefers-reduced-motion: no-preference){
  .wrap{animation:rise .34s cubic-bezier(.22,.8,.28,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<a class="skip" href="#chips">跳到剧源列表</a>

<header>
  <div class="bar">
    <a class="back" href="player-v2.html" aria-label="返回播放器">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 4l-5 6 5 6"/></svg>
    </a>
    <h1>剧库</h1>
    <span class="tag" id="svcTag">读取中</span>
  </div>
</header>

<div class="wrap">
  <div class="field">
    <label for="q">搜索剧名</label>
    <div class="inrow">
      <input id="q" type="search" placeholder="输入关键词，回车搜索" autocomplete="off">
      <button class="btn primary" id="go">搜索</button>
    </div>
  </div>

  <div class="chips" id="chips" aria-label="剧源"></div>
  <div class="auditbox" id="audit" aria-live="polite"></div>
  <div id="view"><p class="hint">正在读取剧库…</p></div>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" aria-hidden="true">
  <div class="hd"><h3 id="shTitle">剧集</h3><button class="x" id="shClose" aria-label="关闭">✕</button></div>
  <div class="eps" id="shEps"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const API = "/qj";
const LIMIT = Number(new URLSearchParams(location.search).get("limit")) || 0;
const LOCAL = { id: "local", name: "我的片库", items: [], title: "创世录 · 本地成片", desc: "", bytes: 0 };
let sources = [], cur = LOCAL.id, apiOk = false;

const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mb = (b) => (b / 1048576).toFixed(1);

/* 无封面时的退化：剧名首两字 + 由标题算出的中性色阶（同一标题永远同一档）。
   先跳过「一/第/我/你」这类开头常见字，否则整屏都是同一枚字，看着像加载占位。 */
const LEAD = /^[一二三四五六七八九十第我你他她它这那大小的是在有个人们上下与和《【（(\[「\s]+/;
const firstChar = (t) => {
  const s = String(t || "").replace(LEAD, "").trim();
  const raw = Array.from(s || String(t || "?"));
  return raw.slice(0, 2).join("") || "?";
};
const toneOf = (t) => {
  let h = 0;
  for (const ch of String(t || "")) h = (h * 31 + ch.codePointAt(0)) | 0;
  return Math.abs(h) % 4;
};

async function api(payload) {
  const r = await fetch(API + "/api/request", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "请求失败");
  return j.data || {};
}

/* 本地片库：不依赖服务，永远可用 */
async function boot() {
  try {
    const j = await (await fetch("local-library.json", { cache: "no-cache" })).json();
    LOCAL.items = (j.items || []).filter(x => x.exists);
    LOCAL.title = j.title || LOCAL.title;
    LOCAL.desc = j.desc || "";
    LOCAL.bytes = LOCAL.items.reduce((a, x) => a + (x.bytes || 0), 0);
  } catch {}
  try {
    const info = await (await fetch(API + "/api/info")).json();
    if (info && info.name) {
      $("#svcTag").textContent = info.name + " " + (info.version || "");
      const s = await (await fetch(API + "/api/sources")).json();
      sources = (s.items || []).filter(x => x.visible).map(x => ({ id: x.id, name: x.name }));
      apiOk = sources.length > 0;
    }
  } catch {
    $("#svcTag").textContent = "仅本地片库";
  }
  const want = new URLSearchParams(location.search).get("src");
  if (want && sources.some(s => s.id === want)) cur = want;
  drawChips();
  render();
}

function drawChips() {
  const all = [{ id: LOCAL.id, name: "我的片库", eps: LOCAL.items.length }].concat(sources.map(s => ({ id: s.id, name: s.name, eps: 0 })));
  const box = $("#chips");
  box.innerHTML = all.map(s =>
    `<button class="chip ${s.id === LOCAL.id ? "eps" : ""}" data-id="${esc(s.id)}" aria-pressed="${s.id === cur}">` +
    `<i aria-hidden="true"></i>${esc(s.name)}${s.id === LOCAL.id ? " · " + s.eps + " 集" : ""}</button>`
  ).join("");
  box.querySelectorAll(".chip").forEach(c => {
    c.onclick = () => {
      cur = c.dataset.id;
      box.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.id === cur)));
      render();
    };
  });
  probeRemote();
}

/* 站源能力：探一次目录，把条数写回 chip；失败就标灰，不假装可用 */
async function probeRemote() {
  for (const s of sources) {
    try {
      const d = await api({ action: "catalog", source: s.id, page: 1 });
      const n = (d.items || []).length;
      const withEps = (d.items || []).filter(x => (x.episodes || 0) > 0).length;
      const el = document.querySelector(`.chip[data-id="${s.id}"]`);
      if (el) {
        el.innerHTML = `<i aria-hidden="true"></i>${esc(s.name)} · ${n} 条${withEps ? "／" + withEps + " 有集数" : ""}`;
        if (withEps) el.classList.add("eps");
      }
    } catch {
      const el = document.querySelector(`.chip[data-id="${s.id}"]`);
      if (el) el.innerHTML = `<i aria-hidden="true"></i>${esc(s.name)} · 不可用`;
    }
  }
}

function render() {
  if (cur === LOCAL.id) return renderLocal();
  return renderRemote();
}

function renderLocal() {
  const n = LOCAL.items.length;
  if (!n) {
    $("#view").innerHTML = `
      <div class="empty">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <rect x="6" y="8" width="28" height="24" rx="3"/><path d="M6 30l9-10 7 7 6-5 6 8"/>
        </svg>
        <p class="t">本机片库还是空的</p>
        <p class="d">先让脚本把成片和封面同步进来，再回来看这一组。</p>
        <button class="btn primary" id="emptyGuide">看怎么做</button>
      </div>`;
    $("#emptyGuide").onclick = () => {
      $("#view").innerHTML = `<div class="err"><span class="t">两条命令</span>` +
        `<code>python tools\\make_posters.py</code><br>` +
        `<code>python tools\\sync_local_library.py</code>` +
        `<p class="hint" style="margin-top:8px">第一条从成片里抽封面，第二条把 dramaList 同步成 local-library.json。</p></div>`;
    };
    return;
  }
  const cover = LOCAL.items[0].poster;
  $("#view").innerHTML = `
    <button class="card" id="openLocal" aria-describedby="localMeta">
      <div class="hero">
        <div class="poster" aria-hidden="true">
          ${cover ? `<img src="${esc(cover)}" alt="" onerror="this.remove()">` : ""}
          <span>${n} 集</span>
        </div>
        <div class="meta">
          <h2>${esc(LOCAL.title)}</h2>
          <p>${esc(LOCAL.desc || "本机成片，不依赖任何站源。")}</p>
          <div class="row" id="localMeta">
            <span>${n} 集</span><span class="dot" aria-hidden="true"></span>
            <span>${mb(LOCAL.bytes)} MB</span><span class="dot" aria-hidden="true"></span>
            <span>本机文件</span>
          </div>
        </div>
      </div>
    </button>
    <p class="hint">直读本机文件，双击即播。第三方站源只给目录元数据时，这里也不受影响。</p>`;
  $("#openLocal").onclick = openLocalSheet;
}

function openLocalSheet() {
  const eps = LOCAL.items;
  $("#shTitle").textContent = LOCAL.title;
  $("#shEps").innerHTML = eps.map(it =>
    `<a class="ep" href="player-v2.html?play=${it.episode}">` +
    (it.poster ? `<img class="thumb" src="${esc(it.poster)}" alt="" loading="lazy" onerror="this.remove()">` : "") +
    `<span class="no">第 ${it.episode} 集</span>` +
    `<span class="tx">${esc(it.title.replace(/^第\d+集[：:]\s*/, ""))}</span></a>`
  ).join("");
  openSheet();
}

async function renderRemote() {
  const v = $("#view");
  v.innerHTML = `<p class="hint">加载中…</p>`;
  try {
    const data = await api({ action: "catalog", source: cur, page: 1 });
    const items = LIMIT ? (data.items || []).slice(0, LIMIT) : (data.items || []);
    if (!items.length) {
      v.innerHTML = `<div class="empty">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <rect x="6" y="10" width="28" height="20" rx="3"/><path d="M12 16h16M12 22h10"/>
        </svg>
        <p class="t">这个源本页没有条目</p>
        <p class="d">不是页面坏了，是源本身这页就是空的。换一页或换一个源试试。</p>
      </div>`;
      return;
    }
    v.innerHTML = `<div class="grid">` + items.map(it => `
      <button class="gcard" data-i="${esc(it.id)}">
        <div class="gposter">
          <span class="mono t${toneOf(it.title)}" aria-hidden="true">${esc(firstChar(it.title))}</span>
          ${it.cover ? `<img src="${esc(it.cover)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
          ${it.episodes ? "" : `<span class="cap">仅目录</span>`}
          <span class="n">${it.episodes ? it.episodes + " 集" : "无集数"}</span>
        </div>
        <div class="gt">${esc(it.title || "")}</div>
      </button>`).join("") + `</div>`;
    v.querySelectorAll(".gcard").forEach(el => {
      el.onclick = () => openRemoteSheet(items.find(x => String(x.id) === el.dataset.i));
    });
  } catch (e) {
    v.innerHTML = `<div class="err"><span class="t">剧库服务没连上</span>` +
      esc(e.message) + `<br><span class="hint">终端里先跑 <code>pwsh tools\\quanju_serve.ps1</code>，` +
      `再跑 <code>python tools\\drama_serve.py --port 8777 --api http://127.0.0.1:8779</code>。</span></div>`;
  }
}

async function openRemoteSheet(it) {
  if (!it) return;
  $("#shTitle").textContent = it.title || "剧集";
  $("#shEps").innerHTML = `<p class="hint">读取详情…</p>`;
  openSheet();
  try {
    const d = await api({ action: "detail", drama: it });
    const ch = d.chapters || [];
    if (!ch.length) {
      $("#shEps").innerHTML = `<p class="hint">这个源只提供目录元数据，没有章节与播放地址。` +
        `这不是页面故障，是源能力边界。</p>`;
      return;
    }
    $("#shEps").innerHTML = ch.map((c, i) =>
      `<button class="ep" data-i="${i}"><span class="no">第 ${i + 1} 集</span>` +
      `<span class="tx">${esc(String(c.title || c.name || ""))}</span></button>`).join("");
  } catch (e) {
    $("#shEps").innerHTML = `<p class="hint">读取失败：${esc(e.message)}</p>`;
  }
}

function openSheet() {
  $("#sheet").classList.add("open");
  $("#sheet").setAttribute("aria-hidden", "false");
  $("#mask").classList.add("on");
  $("#shClose").focus();
  lockScroll(true);
}
function closeSheet() {
  $("#sheet").classList.remove("open");
  $("#sheet").setAttribute("aria-hidden", "true");
  $("#mask").classList.remove("on");
  lockScroll(false);
}
/* iOS 上给 body 加 overflow 是没用的，得用 fixed + 顶回原位；关闭时把滚动位置还原 */
let lockedY = 0;
function lockScroll(on) {
  if (on) {
    lockedY = window.scrollY || 0;
    document.body.style.position = "fixed";
    document.body.style.top = -lockedY + "px";
    document.body.style.left = "0";
    document.body.style.right = "0";
    document.body.style.width = "100%";
  } else {
    document.body.style.position = "";
    document.body.style.top = "";
    document.body.style.left = "";
    document.body.style.right = "";
    document.body.style.width = "";
    window.scrollTo(0, lockedY);
  }
}
$("#mask").onclick = closeSheet;
$("#shClose").onclick = closeSheet;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

$("#go").onclick = doSearch;
$("#q").onkeydown = (e) => { if (e.key === "Enter") doSearch(); };
async function doSearch() {
  const q = $("#q").value.trim();
  if (!q) { render(); return; }
  if (cur === LOCAL.id) {
    const hit = LOCAL.items.filter(x => (x.title + " " + (x.desc || "")).includes(q));
    $("#view").innerHTML = hit.length
      ? hit.map(it => `<a class="ep" href="player-v2.html?play=${it.episode}">` +
        (it.poster ? `<img class="thumb" src="${esc(it.poster)}" alt="" loading="lazy">` : "") +
        `<span class="no">第 ${it.episode} 集</span><span class="tx">${esc(it.title)}</span></a>`).join("")
      : `<div class="empty">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <circle cx="18" cy="18" r="9"/><path d="M25 25l8 8"/>
          </svg>
          <p class="t">本地片库里没有匹配的集</p>
          <p class="d">这个词在 6 集的标题里都没出现。</p>
          <button class="btn" id="clrQ">清除搜索</button>
        </div>`;
    $("#clrQ") && ($("#clrQ").onclick = () => { $("#q").value = ""; render(); });
    return;
  }
  renderRemote();
}

boot();

/* 布局自检：?audit=1，量真实尺寸，不靠眼看 */
function auditLib() {
  const r = (el) => el.getBoundingClientRect();
  const rows = [];
  const chk = (name, pass, got) => rows.push(`<div class="r"><span class="${pass ? "ok" : "no"}">${pass ? "PASS" : "FAIL"}</span><span>${name} · ${got}</span></div>`);
  const q = $("#q"), go = $("#go"), chip = $(".chip"), back = $(".back");
  chk("搜索框高 ≥44px", r(q).height >= 44, Math.round(r(q).height) + "px");
  chk("搜索主按钮高 ≥44px", go ? r(go).height >= 44 : false, go ? Math.round(r(go).height) + "px" : "缺失");
  chk("剧源 chip 高 ≥44px", chip ? r(chip).height >= 44 : false, chip ? Math.round(r(chip).height) + "px" : "缺失");
  chk("返回键触控 ≥44px", back ? r(back).width >= 44 : false, back ? Math.round(r(back).width) + "×" + Math.round(r(back).height) : "缺失");
  const lb = document.querySelector('label[for="q"]');
  chk("搜索框有可见 label", !!lb && r(lb).height > 0, lb ? lb.textContent.trim() : "无");
  const body = parseFloat(getComputedStyle(document.body).fontSize);
  chk("正文字号 ≥16px", body >= 16, body + "px");
  const hint = parseFloat(getComputedStyle($(".hint")).fontSize);
  chk("说明文字 ≥13px", hint >= 13, hint + "px");
  const h1 = parseFloat(getComputedStyle($("h1")).fontSize);
  chk("页面标题 ≥16px", h1 >= 16, h1 + "px");
  const focusables = document.querySelectorAll("button,a[href],input").length;
  chk("可聚焦控件数", focusables >= 5, focusables + " 个");
  const box = $("#audit");
  const pass = rows.every(x => !x.includes('class="no"'));
  box.classList.add("on");
  box.innerHTML = `<div style="font-weight:600;margin-bottom:6px">布局自检 · ${pass ? "全部通过" : "有问题"} · ${window.innerWidth}×${window.innerHeight}</div>` + rows.join("");
}
if (new URLSearchParams(location.search).get("audit") === "1") setTimeout(auditLib, 600);
if (new URLSearchParams(location.search).get("open") === "1") setTimeout(() => {
  if (cur === LOCAL.id) openLocalSheet(); else if ($(".gcard")) $(".gcard").click();
}, 700);

/* 离线外壳：与播放器共用 sw.js */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
